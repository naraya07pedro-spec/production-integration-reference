name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: reference_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reference -d reference_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://reference:local-ci-only@localhost:5432/reference_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run demo
  reviewer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node --test tests/reviewer-smoke.test.mjs
      - run: node scripts/reviewer-smoke.mjs
      - name: Preserve exact-revision reviewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/reviewer-smoke.json
          if-no-files-found: warn
          retention-days: 14
